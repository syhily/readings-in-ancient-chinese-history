  《中国古代史读本》（上下册）是北京大学出版社「大学历史学论文读本系列」之一，陈苏镇、张帆编。全书选收自近代新史学产生以来公开发表的中国古代史研究论文四十篇：上册自殷周至南北朝，收王国维、郭沫若、傅斯年、陈寅恪、唐长孺、周一良等名篇二十篇；下册自隋唐至清代，收汪篯、严耕望、邓广铭、吴晗、余英时等名篇二十篇。每篇选文前附选文导读与作者介绍，篇末附注释与参考论著。
